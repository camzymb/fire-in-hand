<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fire in Hand</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
        }
        canvas { display: block; }
        /* Webcam fills the whole screen, mirrored like a selfie */
        #video-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            transform: scaleX(-1);
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: fixed; inset: 0; z-index: 1; }
    </style>
</head>
<body>

    <div id="info">Open your palm to summon fire. Spread your fingers to make it bigger. Close your fist to snuff it out.</div>

    <div id="video-container">
        <video id="input_video"></video>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script type="module">
        import * as THREE from 'three';

        // ================= SETTINGS YOU CAN PLAY WITH =================
        const PARTICLE_COUNT = 3000;   // more = denser fire, but slower
        const FLAME_HEIGHT   = 5.0;    // how tall the flames reach
        const FLAME_WIDTH    = 1.2;    // how wide the base of the fire is
        const RISE_SPEED     = 3.0;    // how fast particles float upward
        const FLICKER        = 1.4;    // side-to-side wobble amount
        const PARTICLE_SIZE  = 40.0;   // base size of each spark
        // ==============================================================

        // --- Hand state ---
        let handPos = new THREE.Vector3(0, -3, 0);
        let intensity = 0;        // 0 = no fire, 1 = full fire
        let targetIntensity = 0;
        let handSeen = false;

        // --- Three.js setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);   // transparent so the webcam shows through
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Soft round glow texture
        function createTexture() {
            const c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            g.addColorStop(0.0, 'rgba(255,255,255,1)');
            g.addColorStop(0.25, 'rgba(255,255,255,0.6)');
            g.addColorStop(0.6, 'rgba(255,255,255,0.12)');
            g.addColorStop(1.0, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 64, 64);
            const t = new THREE.Texture(c);
            t.needsUpdate = true;
            return t;
        }

        // --- Particle data ---
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const lifeAttr  = new Float32Array(PARTICLE_COUNT);   // 0..1, how far through its life
        const sizeAttr  = new Float32Array(PARTICLE_COUNT);

        const age      = new Float32Array(PARTICLE_COUNT);    // seconds alive
        const maxAge   = new Float32Array(PARTICLE_COUNT);
        const vel      = new Float32Array(PARTICLE_COUNT * 3);
        const seed     = new Float32Array(PARTICLE_COUNT);

        function respawn(i) {
            const idx = i * 3;
            // start in a flat disc at the palm
            const a = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * FLAME_WIDTH * (0.3 + intensity * 0.7);
            positions[idx]     = handPos.x + Math.cos(a) * r;
            positions[idx + 1] = handPos.y + (Math.random() - 0.5) * 0.3;
            positions[idx + 2] = handPos.z + Math.sin(a) * r * 0.6;

            // particles near the centre live longer and rise higher
            const centerness = 1 - r / (FLAME_WIDTH + 0.001);
            maxAge[i] = (0.6 + Math.random() * 0.8) * (0.5 + centerness) * (0.3 + intensity);
            age[i] = Math.random() * 0.1;

            vel[idx]     = (Math.random() - 0.5) * 0.6;
            vel[idx + 1] = RISE_SPEED * (0.7 + Math.random() * 0.6) * (0.4 + intensity * 0.6);
            vel[idx + 2] = (Math.random() - 0.5) * 0.6;

            seed[i] = Math.random() * 100;
            sizeAttr[i] = PARTICLE_SIZE * (0.6 + Math.random() * 0.8);
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            respawn(i);
            age[i] = Math.random() * maxAge[i]; // stagger so it doesn't start as a burst
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aLife', new THREE.BufferAttribute(lifeAttr, 1));
        geometry.setAttribute('aSize', new THREE.BufferAttribute(sizeAttr, 1));

        // Custom shader so each spark can have its own size and colour over its life
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTex: { value: createTexture() },
                uIntensity: { value: 0 }
            },
            vertexShader: `
                attribute float aLife;
                attribute float aSize;
                varying float vLife;
                void main() {
                    vLife = aLife;
                    vec4 mv = modelViewMatrix * vec4(position, 1.0);
                    // sparks shrink as they age
                    float s = aSize * (1.0 - aLife * 0.8);
                    gl_PointSize = s * (10.0 / -mv.z);
                    gl_Position = projectionMatrix * mv;
                }
            `,
            fragmentShader: `
                uniform sampler2D uTex;
                uniform float uIntensity;
                varying float vLife;
                void main() {
                    float a = texture2D(uTex, gl_PointCoord).a;
                    // colour ramp: white-yellow -> orange -> red -> dark
                    vec3 c1 = vec3(1.0, 0.95, 0.6);
                    vec3 c2 = vec3(1.0, 0.55, 0.08);
                    vec3 c3 = vec3(0.85, 0.12, 0.02);
                    vec3 c4 = vec3(0.15, 0.0, 0.0);
                    vec3 col;
                    if (vLife < 0.25)      col = mix(c1, c2, vLife / 0.25);
                    else if (vLife < 0.6)  col = mix(c2, c3, (vLife - 0.25) / 0.35);
                    else                   col = mix(c3, c4, (vLife - 0.6) / 0.4);
                    float fade = 1.0 - smoothstep(0.5, 1.0, vLife);
                    gl_FragColor = vec4(col, a * fade * uIntensity);
                }
            `,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true
        });

        const fire = new THREE.Points(geometry, material);
        scene.add(fire);

        // --- MediaPipe hand tracking ---
        const videoElement = document.getElementById('input_video');

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                handSeen = true;

                // Palm centre = average of wrist and the four finger bases
                const palm = [0, 5, 9, 13, 17].reduce((acc, k) => {
                    acc.x += lm[k].x / 5; acc.y += lm[k].y / 5; return acc;
                }, { x: 0, y: 0 });

                // Convert the palm position (0..1 in the video) to a spot on screen,
                // accounting for the video being cropped to fill the screen and mirrored.
                const vidW = videoElement.videoWidth  || 640;
                const vidH = videoElement.videoHeight || 480;
                const scrW = window.innerWidth, scrH = window.innerHeight;
                const sc = Math.max(scrW / vidW, scrH / vidH);
                const dispW = vidW * sc, dispH = vidH * sc;
                const nx = 1 - (palm.x * dispW - (dispW - scrW) / 2) / scrW;  // mirrored
                const ny =     (palm.y * dispH - (dispH - scrH) / 2) / scrH;

                // Then to 3D world units at the fire's depth (z = 0)
                const visH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
                const visW = visH * camera.aspect;
                const targetX = (nx - 0.5) * visW;
                const targetY = (0.5 - ny) * visH;
                handPos.lerp(new THREE.Vector3(targetX, targetY, 0), 0.3);

                // Openness: how far the fingertips are from the palm, relative to hand size
                const handSize = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) + 0.001;
                let open = 0;
                for (const tip of [8, 12, 16, 20]) {
                    open += Math.hypot(lm[tip].x - palm.x, lm[tip].y - palm.y) / handSize;
                }
                open /= 4;   // roughly 0.5 = fist, 1.6 = wide open
                targetIntensity = THREE.MathUtils.clamp((open - 0.8) / 0.8, 0, 1);
            } else {
                handSeen = false;
                targetIntensity = 0;
            }
        }

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(onResults);

        const cam = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cam.start();

        // --- Animation loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const t = clock.getElapsedTime();

            intensity += (targetIntensity - intensity) * 0.12;
            material.uniforms.uIntensity.value = intensity;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const idx = i * 3;
                age[i] += dt;
                if (age[i] >= maxAge[i]) {
                    if (intensity > 0.02) respawn(i);
                    else { lifeAttr[i] = 1; continue; }   // fire is out, keep it invisible
                }
                const life = age[i] / maxAge[i];
                lifeAttr[i] = life;

                // wobble side to side like real flames, stronger higher up
                const wob = Math.sin(t * 6 + seed[i]) * FLICKER * life * dt;
                positions[idx]     += vel[idx] * dt + wob;
                positions[idx + 1] += vel[idx + 1] * dt * (1 - life * 0.3);
                positions[idx + 2] += vel[idx + 2] * dt + Math.cos(t * 5 + seed[i]) * FLICKER * 0.5 * life * dt;

                // pull sparks inward as they rise so the flame tapers to a point
                const pull = 0.9 * dt * life;
                positions[idx]     += (handPos.x - positions[idx]) * pull;
                positions[idx + 2] += (handPos.z - positions[idx + 2]) * pull;
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.aLife.needsUpdate = true;
            geometry.attributes.aSize.needsUpdate = true;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
